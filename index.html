<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=prototype/index.html">
<title>IdlePixelMMORPG — прототип интерфейса</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b14;color:#eaf0ff;
       font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center}
  .box{max-width:520px;padding:32px}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#8d9ab5;margin:0 0 20px}
  a{display:inline-block;padding:11px 20px;border:1px solid #f0a03c;border-radius:9px;
    color:#f0a03c;text-decoration:none;font-weight:600}
  a:hover{background:rgba(240,160,60,.12)}
  .spin{width:26px;height:26px;margin:0 auto 22px;border:2px solid rgba(255,255,255,.15);
        border-top-color:#f0a03c;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <h1>IdlePixelMMORPG</h1>
    <p>Открываю прототип интерфейса…</p>
    <a href="prototype/index.html">Открыть прототип вручную</a>
  </div>
  <script>location.replace('prototype/index.html');</script>
</body>
</html>
