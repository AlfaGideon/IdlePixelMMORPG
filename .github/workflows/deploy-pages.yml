name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [arena/58423ecd-idlepixelmmorpg]
  workflow_dispatch:

# Даём GITHUB_TOKEN максимум: включение Pages «с нуля» требует прав,
# которых нет у внешнего integration-токена Arena.
permissions: write-all

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable / configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r prototype _site/
          echo "--- site contents ---"
          find _site -type f | sort
          du -sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
